server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/dcp?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:}  # 默认空值，避免启动报错

  # 解决 Spring Boot 2.6+ 与 Swagger 2 的兼容性问题
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印 SQL，方便调试
    map-underscore-to-camel-case: true # 下划线自动映射驼峰 (category_id -> categoryId)
  mapper-locations: classpath:mapper/*.xml

# Redis 配置
redis:
  host: 127.0.0.1
  port: 6379
  password: ${REDIS_PASSWORD:}
  database: 0
  lettuce:
    pool:
      max-active: 8
      max-wait: -1ms
      max-idle: 8
      min-idle: 0

# DeepSeek AI 配置
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}  # 通过环境变量注入，避免泄露
  model: deepseek-v4-flash
