server:
  port: 8080 # 网页访问端口

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/dcp?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:}  # 加回默认空值，让启动不报错，由业务代码负责降级处理，下同

  # 解决 Spring Boot 2.6+ 与 Swagger 2 的兼容性问题
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis:
  # 打印底层 SQL，方便我们以后调试排错
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  # 开启驼峰命名自动映射 (把 category_id 自动转成 categoryId)
    map-underscore-to-camel-case: true
  # 如果我们后面写 mapper.xml，告诉系统去哪里找它
  mapper-locations: classpath:mapper/*.xml

# 新增 Redis 配置
redis:
  host: 127.0.0.1
  port: 6379
  password: ${REDIS_PASSWORD:} # 本地的 Redis 没有密码，这里留空即可
  database: 0 # 使用 0 号数据库
  lettuce:
    pool:
      max-active: 8 # 连接池最大连接数
      max-wait: -1ms # 连接池最大阻塞等待时间（负值表示没有限制）
      max-idle: 8 # 连接池中的最大空闲连接
      min-idle: 0 # 连接池中的最小空闲连接

# AI 大模型配置
deepseek:
  # 使用环境变量读取，防止 Key 泄露到 GitHub
  api-key: ${DEEPSEEK_API_KEY:}
  # 将模型名称抽取到配置文件中，方便未来一键升级
  model: deepseek-v4-flash
